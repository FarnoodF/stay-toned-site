<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Claim a Pro offer - StayToned</title>
    <link rel="icon" href="/assets/images/icon-glyph.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="stylesheet" href="/assets/css/offer.css" />
    <script src="/assets/js/theme.js"></script>
    <script defer src="/assets/js/offer.js"></script>
  </head>
  <body>
    <main class="offer-page">
      <section class="offer-panel">
        <img class="offer-mark" src="/assets/images/icon-glyph.svg" alt="" />
        <p class="eyebrow">StayToned Pro offer</p>
        <h1 id="offer-title">Opening StayToned</h1>
        <p class="lede" id="offer-copy">
          If the app is installed, your offer will open there. Log in or create an account before it is added.
        </p>

        <div class="offer-actions" id="offer-actions">
          <a class="button button-primary" id="open-app-link" href="staytoned://offer/redeem">Open StayToned</a>
          <a class="button button-secondary" id="store-link" href="/">Download the app</a>
        </div>

        <div class="offer-rescan" id="rescan-note">
          <strong>Installing for the first time?</strong>
          <span>After installation, scan the same QR code again to claim the offer.</span>
        </div>
      </section>
    </main>
  </body>
</html>
