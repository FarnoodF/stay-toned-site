<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 260 260"
  role="img"
  aria-label="StayToned"
  shape-rendering="geometricPrecision"
>
  <defs>
    <linearGradient id="red" x1="39" y1="21" x2="223" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A50" />
      <stop offset="1" stop-color="#E01D3B" />
    </linearGradient>
    <linearGradient id="orange" x1="72" y1="47" x2="176" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB020" />
      <stop offset="1" stop-color="#E07800" />
    </linearGradient>
    <linearGradient id="green" x1="83" y1="67" x2="204" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43DC66" />
      <stop offset="1" stop-color="#189A3C" />
    </linearGradient>
    <linearGradient id="blue" x1="88" y1="92" x2="176" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA3FF" />
