    <circle cx="130" cy="130" r="102" />
    <circle cx="130" cy="130" r="79" />
  </g>

  <path
    d="M 95 106 H 165 Q 169 106 169 110 V 118 Q 169 122 165 122 H 141 V 175 Q 141 180 136 180 H 124 Q 119 180 119 175 V 122 H 95 Q 91 122 91 118 V 110 Q 91 106 95 106 Z"
    fill="url(#blue)"
    transform="translate(-13 -18.3) scale(1.1)"
    filter="url(#lift)"
  />
