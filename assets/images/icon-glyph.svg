    <filter id="lift" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.6" flood-color="#12213D" flood-opacity="0.16" />
    </filter>
